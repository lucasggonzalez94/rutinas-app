version: '3'

services:
  # Servicio de la aplicación Django (vistas)
  django_app:
    build: 
      context: .
      dockerfile: Dockerfile.django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-dev-only-key
      - API_URL=http://node_api:3000/api
    restart: always
    depends_on:
      - node_api

  # Servicio de la API de Node.js
  node_api:
    build:
      context: ./api_node
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ./api_node/src:/app/src
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - JWT_SECRET=jwt-secret-dev-only
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=rutinas
    restart: always
    depends_on:
      - mysql

  # Servicio de base de datos MySQL
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=rutinas
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mysql_data:
